name: Run Daily AI Engine
permissions:
  contents: write


on:
  # This tells GitHub to run your code automatically every day at 9:00 AM UTC
  schedule:
    - cron: '0 9 * * *'
  
  # This adds a manual button so you can test run it whenever you want!
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google AI Library
      run: |
        python -m pip install --upgrade pip
              pip install --upgrade google-generativeai


    - name: Run App Script and Update Files
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python app.py

    - name: Commit and Push Daily AI Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add daily_output.txt
        git commit -m "Automated update: New daily AI response generated" || echo "No changes to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

