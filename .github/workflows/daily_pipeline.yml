name: Daily Script Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -U google-genai
        
      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python engine.py
          
      - name: Prepare Artifact Folder
        run: |
          mkdir -p public
          # Copy files explicitly to ensure they are captured
          cp index.html public/ || true
          cp about.html public/ || true
          cp contact.html public/ || true
          cp disclaimer.html public/ || true
          cp automation-tips.html public/ || true
          cp sales-funnel-guide.html public/ || true
          cp ai-productivity.html public/ || true
          # List files to verify they are in the folder
          echo "Files in public folder:"
          ls -R public/
          
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
          
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
