name: Daily Script Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  execute:
    runs-on: ubuntu-latest
    # THIS SECTION IS CRITICAL:
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run script
        run: |
          pip install -U google-generativeai
          python engine.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Use '|| exit 0' to prevent the action from failing if there are no changes
          git commit -m "Update site with AI content" || exit 0
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
