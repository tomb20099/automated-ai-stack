<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{TITLE}</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; }
        /* This CSS forces your images to look perfect every time */
        .article-image { max-width: 450px; width: 100%; height: auto; border-radius: 12px; display: block; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .cta-box { background-color: #f0f8ff; padding: 25px; border-radius: 10px; margin-top: 40px; border: 1px solid #d1e7dd; text-align: center; }
    </style>
</head>
<body>
    {CONTENT}
    <div class='cta-box'>
        <h3>Want to Scale Faster?</h3>
        <p>Get my free <strong>Business Automation Blueprint</strong>.</p>
        <a href="{NEWSLETTER_LINK}" style="padding: 12px 25px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">Get My Free Blueprint</a>
    </div>
</body>
</html>
